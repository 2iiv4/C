<style>
:root{--n:#0F1B3D;--p:#FF3D8B;--o:#F5F1E6;--sf:'Playfair Display',Georgia,serif;--sn:'DM Sans',system-ui,sans-serif;--hw:'Caveat','Bradley Hand',cursive}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--o);color:var(--n);font:400 16px/1.55 var(--sn);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--n);outline-offset:3px;border-radius:8px}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}#bg i{position:absolute;font-style:normal;animation:flt 8s ease-in-out infinite alternate}
@keyframes flt{to{transform:translateY(-12px) rotate(8deg)}}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:center;padding:calc(14px + env(safe-area-inset-top)) 12px 8px;pointer-events:none}
#dots{display:flex;gap:7px}#dots i{width:8px;height:8px;border-radius:9px;background:rgba(15,27,61,.2);transition:.4s}#dots i.on{width:24px;background:var(--p)}
.stage{position:fixed;inset:0;z-index:1;display:none;overflow:auto;padding:56px 16px 28px}.stage.active{display:flex}
.in{position:relative;z-index:2;margin:auto;width:100%;max-width:560px;text-align:center}
.stage.active .in{animation:in .6s both}.stage.out .in{animation:out .45s both}
@keyframes in{from{opacity:0;transform:translateY(18px)}}@keyframes out{to{opacity:0;transform:translateY(-14px) scale(.98)}}
h1,h2,h3{font-family:var(--sf);line-height:1.15}
.btn{background:var(--p);color:#fff;border:0;border-radius:99px;padding:14px 28px;min-height:48px;font-weight:600;font-size:17px;box-shadow:0 4px 0 var(--n);transition:transform .15s}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--n)}
.hw{font-family:var(--hw);font-weight:500}
.card{background:#fff;border-radius:14px;box-shadow:0 8px 22px rgba(15,27,61,.1);border:1px solid rgba(15,27,61,.08)}
.fx,.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fx i{position:absolute;bottom:-30px;font-style:normal;animation:rise linear infinite}
@keyframes rise{from{opacity:.8}to{transform:translate(var(--x),-110vh) rotate(40deg);opacity:0}}
.bq{width:min(60vw,230px);height:auto;display:block;margin:0 auto 6px;transition:width .7s}.read .bq{width:min(34vw,120px)}
.sw{transform-origin:150px 290px;animation:sway 5s ease-in-out infinite alternate}@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.env{position:relative;display:block;width:min(78vw,280px);height:160px;margin:10px auto 0;background:none;border:0;perspective:800px}
.eb{position:absolute;inset:0;background:#fff;border:2px solid var(--n);border-radius:8px}
.ep{position:absolute;left:14px;right:14px;top:10px;bottom:10px;background:var(--o);border:1px solid rgba(15,27,61,.2);opacity:0;transition:.7s .25s;z-index:1}
.ef{position:absolute;left:0;right:0;top:0;height:62%;background:var(--p);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s;z-index:3}
.et{position:absolute;left:0;right:0;bottom:14px;font-size:25px;z-index:2;transition:opacity .3s}
.env.open .ef{transform:rotateX(180deg);z-index:0}.env.open .et{opacity:0}.env.open .ep{opacity:1;transform:translateY(-34px)}
.read .env{display:none}#letter{display:none;text-align:left;padding:24px 22px;transform-origin:top;margin-top:6px}
.read #letter{display:block;animation:unf .8s both}@keyframes unf{from{opacity:0;transform:scaleY(.1)}}
#letter h2{font-size:28px;margin-bottom:8px}#letter p,.fin p{font:500 23px/1.3 var(--hw);margin-bottom:10px}#letter .btn{display:block;margin:16px auto 0}
.cert{position:relative;display:block;width:min(100%,440px);margin:0 auto;background:#fff;padding:30px 24px 26px;text-align:center;cursor:pointer;box-shadow:inset 0 0 0 7px #fff,inset 0 0 0 9px var(--p),0 12px 28px rgba(15,27,61,.14);animation:drop .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(-5deg) scale(.85)}}
.cert.gone{animation:van .7s forwards}@keyframes van{to{opacity:0;transform:scale(.6) rotate(6deg) translateY(-30px)}}
.cert small{display:block;font-weight:600;font-size:12px;letter-spacing:.2em}.cert h2{font-size:clamp(26px,7vw,34px);margin:8px 0 6px}
.cert .sub{display:inline-block;font-weight:600;font-size:13px;letter-spacing:.16em;border-bottom:2px solid var(--p);padding-bottom:2px}
.cert p{font-size:15px;margin-top:10px}.cert .ft{font:500 23px var(--hw);margin-top:16px}
.st{position:absolute;color:var(--p);animation:tw 2s infinite alternate}@keyframes tw{to{opacity:.3;transform:scale(.7)}}

.fm{animation:fl .5s infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{to{transform:scale(.8,1.15)}}
.fin{position:relative;padding:30px 22px;text-align:left}.fin p{animation:in .8s both;animation-delay:calc(var(--i)*.3s + .3s)}.fin h2{font-size:30px;margin-bottom:10px}
.fin:before,.fin:after{content:"♥";position:absolute;color:var(--p);font-size:20px;top:-11px;left:16px}.fin:after{left:auto;right:16px}
.big{font:800 clamp(20px,5.4vw,26px)/1.2 var(--sf);text-align:center;margin:18px 0}
@media(prefers-reduced-motion:reduce){*,*:before{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

:root{--sf:'Amiri',Georgia,serif;--sn:'Cairo',system-ui,sans-serif;--hw:'Aref Ruqaa','Amiri',serif}
h1,h2,h3{line-height:1.5}.hw{line-height:1.7}.cert small,.cert .sub{letter-spacing:0}.cert small{font-size:14px}
#letter,.fin{text-align:start}
#letter p,.fin p{font-size:21px;line-height:1.9}#letter h2,.fin h2{font-size:28px}.cert .ft{font-size:20px}.cert p{line-height:1.8}.big{font-weight:700}
.bqw{position:relative;width:min(64vw,280px);margin:0 auto 6px;transition:width .7s;transform-origin:50% 95%;animation:sway 5s ease-in-out infinite alternate}.read .bqw{width:min(34vw,120px)}.read .hintc{display:none}
.bq,.read .bq{width:100%;height:auto;display:block;margin:0}
.cd{position:absolute;padding:0;border:0;background:none;transform:rotate(var(--a));animation:bob 2.2s ease-in-out infinite;transition:scale .2s}.cd:hover{scale:1.1}.cd img{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 4px rgba(15,27,61,.3))}
@keyframes bob{50%{translate:0 -5px}}
#fly{position:fixed;z-index:60}#fly img{position:absolute;left:0;bottom:0;width:100%;height:auto;transition:opacity .5s,transform .7s cubic-bezier(.2,.8,.2,1);transform-origin:50% 100%}
#fly .eo{opacity:0;transform:perspective(900px) rotateX(-35deg) scale(.94)}#fly.o .eo{opacity:1;transform:none}#fly.o .ec{opacity:0}
.slot{position:absolute;left:0;bottom:0;width:100%}
.pp{position:absolute;left:9%;width:82%;top:70%;height:56%;border-radius:6px;background:#fff repeating-linear-gradient(transparent 0 17px,rgba(15,27,61,.12) 17px 18px);box-shadow:0 2px 8px rgba(15,27,61,.2);transition:transform 1s cubic-bezier(.3,.8,.3,1);display:grid;place-items:center;color:var(--p)}.pp i{font-style:normal;font-size:26px}#fly.p .pp{transform:translateY(-111%)}


#s2 .in{max-width:720px}.cert{padding:6px;width:min(100%,680px);background:#fff;box-shadow:0 12px 28px rgba(15,27,61,.18)}.cert img{display:block;width:100%;height:auto;border-radius:2px}
.cert{width:min(100%,620px);padding:0;background:none;border-radius:4px;overflow:hidden;box-shadow:0 12px 28px rgba(15,27,61,.16)}.cert img{width:100%;height:auto;display:block;user-select:none}#s2 .in{max-width:640px}


.np{display:block;width:min(100%,520px);height:auto;margin:0 auto 22px;filter:drop-shadow(0 12px 22px rgba(15,27,61,.2));animation:drop .9s cubic-bezier(.2,1.3,.4,1) both;user-select:none}
.ms{--ms:'Lemonada','Cairo',system-ui,sans-serif}
.hw.ms{font-family:var(--ms);font-weight:500;font-size:17px!important;line-height:1.9}
#letter h2,#letter p{font-family:'Lemonada','Cairo',system-ui,sans-serif}
#letter h2{font-weight:600;font-size:25px;line-height:1.6}
#letter p{font-weight:500;font-size:18px;line-height:2}

/* one font everywhere: Amiri (same as the final line) */
:root{--sf:'Amiri',Georgia,serif;--sn:'Amiri',Georgia,serif;--hw:'Amiri',Georgia,serif;--ms:'Amiri',Georgia,serif}
*{font-family:'Amiri',Georgia,serif!important;font-weight:700!important;font-style:normal!important;letter-spacing:0!important}
.btn{font-size:20px;font-weight:700}
#letter h2{font-size:30px;font-weight:700}
#letter p,.fin p{font-size:23px;line-height:1.8}
.hw.ms{font-size:21px!important;line-height:1.9}
.cert .ft{font-size:22px}

/* one font size for every text (same as the final line) */
:root{--fs:clamp(20px,5.4vw,26px)}
h1,h2,h3,p,.btn,.big,.hw,.hw.ms,.hintc,#letter h2,#letter p,.fin h2,.fin p,.cert p,.cert .ft,.cert small,.cert .sub{font-size:var(--fs)!important;line-height:1.8!important}

function confetti(){if(R)return;cfe&&cfe.remove();const z='max(100vw,100vh)',e=new Image();e.src=CF;e.alt='';e.setAttribute('aria-hidden','true');
e.style.cssText=`position:fixed;z-index:40;left:50%;top:0;width:${z};height:${z};margin-left:calc(${z}/-2);pointer-events:none;user-select:none;opacity:0`;
document.body.append(e);cfe=e;
e.animate([{transform:'translateY(-100%)',opacity:0},{opacity:.9,offset:.1},{opacity:.9,offset:.72},{transform:'translateY(100vh)',opacity:0}],{duration:5200,easing:'linear'}).onfinish=()=>{e.remove();if(cfe==e)cfe=null}}
/* stages */
const S=[...Array(4)].map((_,i)=>$('#s'+(i+1))),dots=$('#dots');let busy=0;
for(let i=0;i<4;i++)dots.append(document.createElement('i'));
function go(n){if(busy)return;busy=1;const o=$('.stage.active'),sw=()=>{o&&o.classList.remove('active','out');S[n-1].classList.add('active');S[n-1].scrollTop=0;[...dots.children].forEach((d,i)=>d.classList.toggle('on',i==n-1));dots.setAttribute('aria-label',`الخطوة ${n} من 4`);busy=0;n==2&&setTimeout(confetti,D(350))};o?(o.classList.add('out'),setTimeout(sw,D(450))):sw()}
/* 1 envelope */
const cd=$('#cd'),EC=0.7885,EO=1.2058,V=[[0.013, 0.426], [0.349, 0.677], [0.643, 0.677], [0.984, 0.419]];
cd.onclick=()=>{if(cd.dataset.d||busy)return;cd.dataset.d=1;
const r=cd.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,Wf=Math.min(vw*.78,300),Hc=Wf*EC,Ho=Wf*EO,f=document.createElement('div'),p=V.map(q=>q.map(n=>n*100));
f.id='fly';f.style.cssText=`width:${Wf}px;height:${Hc}px;left:${(vw-Wf)/2}px;top:${Math.max(vh*.6-Hc/2,Ho-Hc+70)}px`;
const o=$('#eoimg').cloneNode();o.hidden=false;o.className='eo';const c=$('img',cd).cloneNode();c.className='ec';
f.innerHTML=`<div class="slot" style="height:${Ho}px;clip-path:polygon(0 0,100% 0,100% ${p[3][1]}%,${p[3][0]}% ${p[3][1]}%,${p[2][0]}% ${p[2][1]}%,${p[1][0]}% ${p[1][1]}%,${p[0][0]}% ${p[0][1]}%,0 ${p[0][1]}%)"><div class="pp"><i>♥</i></div></div>`;
f.prepend(o);f.append(c);document.body.append(f);cd.style.visibility='hidden';
const b=f.getBoundingClientRect(),s=r.width/b.width,dx=r.left+r.width/2-(b.left+b.width/2),dy=r.top+r.height/2-(b.top+b.height/2),A=3.0;
f.animate([{transform:`translate(${dx}px,${dy}px) scale(${s}) rotate(${A}deg)`},{transform:`translate(${dx*.3}px,${dy*.3-80}px) scale(${(1+s)/2}) rotate(${A/2}deg)`,offset:.55},{transform:'translate(0px,0px) scale(1) rotate(0deg)'}],{duration:D(950),easing:'cubic-bezier(.3,.7,.3,1)'});
setTimeout(()=>f.classList.add('o'),D(1000));setTimeout(()=>f.classList.add('p'),D(1600));
setTimeout(()=>{f.animate([{opacity:1},{opacity:0}],{duration:D(450),fill:'forwards'}).onfinish=()=>f.remove();S[0].classList.add('read');$('#b1').focus({preventScroll:true})},D(2800))};
$('#b1').onclick=()=>go(2);
/* 2 award */
cert.onclick=()=>{if(busy||cert.classList.contains('gone'))return;cert.classList.add('gone');setTimeout(()=>go(3),D(650))};
cert.onkeydown=e=>(e.key=='Enter'||e.key==' ')&&(e.preventDefault(),cert.click());
/* 3 newspaper */
$('#b4').onclick=()=>go(4);
/* 4 + restart */
function reset(){cfe&&cfe.remove();cfe=null;
{const f=$('#fly');f&&f.remove();cd.dataset.d='';cd.style.visibility=''}S[0].classList.remove('read');cert.classList.remove('gone');
go(1)}
go(1);
